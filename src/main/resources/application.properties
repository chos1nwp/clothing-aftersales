server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# 本地密钥文件不入库，见 README「环境准备」
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/clothing_aftersales?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=${AFTERSALES_DB_USER:aftersales}
spring.datasource.password=${AFTERSALES_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.example.aftersales.entity

# 售后凭证本地存储目录
app.upload-dir=uploads
app.max-upload-size-bytes=5242880
app.max-evidence-count=6

# 演示项目改完页面要能立刻看到效果：让浏览器每次都带 ETag/Last-Modified 回源校验
spring.web.resources.cache.period=0
spring.web.resources.cache.cachecontrol.no-cache=true
app.max-evidence-count=6

logging.level.com.example.aftersales=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{20} - %msg%n
